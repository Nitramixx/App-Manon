{% extends 'base.html' %}

{% block title %}Jeu de Puzzle 🧩{% endblock %}

{% block nav %}PUZZLE{% endblock %}

{% block content %}
<div class="container">
    <h1 class="page-title">RECONSTITUE L'IMAGE !</h1>

    <div class="puzzle-container" id="media-focus">
        
        <div class="puzzle-sidebar">
            <div class="model-frame">
                <h3>Modèle</h3>
                <img src="{{ url_for('static', filename=original_image.replace('static/', '')) }}" alt="Modèle">
            </div>
            
            <div class="puzzle-controls">
                <button onclick="location.reload()" class="btn-control" style="font-size: 1rem; width:100%; margin-bottom: 10px;">
                    Mélanger
                </button>
                <a href="{{ url_for('puzzle_menu') }}" class="btn-back" style="display:block; text-align:center;">
                    ⬅ Changer
                </a>
            </div>
        </div>

        <div class="puzzle-board" id="board" style="grid-template-columns: repeat({{ grid_size }}, 1fr);">
            {% for piece in pieces %}
                <div class="puzzle-piece" 
                     draggable="true" 
                     data-correct="{{ piece.correct_pos }}"
                     style="background-image: url('{{ url_for('static', filename=piece.src) }}');">
                </div>
            {% endfor %}
        </div>

    </div>

    <div id="win-message" style="display:none; text-align:center; margin-top:30px;">
        <h2 style="color: #4CAF50; font-size: 3rem; text-shadow: 2px 2px 0px white;">BRAVO ! C'EST GAGNÉ ! 🎉</h2>
        <a href="{{ url_for('puzzle_menu') }}" class="btn-control" style="background:#4CAF50;">NOUVEAU PUZZLE</a>
    </div>

</div>

<script>
    const board = document.getElementById('board');
    let selectedPiece = null;

    // --- GESTION DU CLIC (SWAP) ---
    board.addEventListener('click', function(e) {
        // On vérifie qu'on a cliqué sur une pièce
        const clickedPiece = e.target.closest('.puzzle-piece');
        if (!clickedPiece) return;

        // Si aucune pièce sélectionnée, on sélectionne celle-ci
        if (!selectedPiece) {
            selectedPiece = clickedPiece;
            selectedPiece.classList.add('selected');
        } 
        // Si on clique sur la MÊME pièce, on désélectionne
        else if (selectedPiece === clickedPiece) {
            selectedPiece.classList.remove('selected');
            selectedPiece = null;
        } 
        // Si on clique sur une AUTRE pièce, on échange !
        else {
            swapPieces(selectedPiece, clickedPiece);
            selectedPiece.classList.remove('selected');
            selectedPiece = null;
            checkWin();
        }
    });

    // --- GESTION DRAG & DROP (GLISSER-DÉPOSER) ---
    let draggedPiece = null;

    board.addEventListener('dragstart', (e) => {
        draggedPiece = e.target;
        e.target.style.opacity = '0.5';
    });

    board.addEventListener('dragend', (e) => {
        e.target.style.opacity = '1';
    });

    board.addEventListener('dragover', (e) => {
        e.preventDefault(); // Autorise le drop
    });

    board.addEventListener('drop', (e) => {
        e.preventDefault();
        const targetPiece = e.target.closest('.puzzle-piece');
        
        if (targetPiece && draggedPiece && targetPiece !== draggedPiece) {
            swapPieces(draggedPiece, targetPiece);
            checkWin();
        }
    });

    // --- FONCTION D'ÉCHANGE (SWAP DOM) ---
    function swapPieces(pieceA, pieceB) {
        // Astuce : On crée un marqueur temporaire pour échanger les positions dans le DOM
        const temp = document.createElement('div');
        pieceA.parentNode.insertBefore(temp, pieceA);
        pieceB.parentNode.insertBefore(pieceA, pieceB);
        temp.parentNode.insertBefore(pieceB, temp);
        temp.parentNode.removeChild(temp);
    }

    // --- VÉRIFICATION VICTOIRE ---
    function checkWin() {
        const pieces = document.querySelectorAll('.puzzle-piece');
        const gridSize = {{ grid_size }};
        let isWin = true;

        pieces.forEach((piece, index) => {
            // On calcule la position "row-col" attendue pour cet index de grille
            const row = Math.floor(index / gridSize);
            const col = index % gridSize;
            const expectedPos = `${row}-${col}`;

            if (piece.dataset.correct !== expectedPos) {
                isWin = false;
            }
        });

        if (isWin) {
            document.getElementById('win-message').style.display = 'block';
            board.style.border = '5px solid #4CAF50';
            // Animation de succès
            pieces.forEach(p => p.style.border = 'none');
            
            // Effet confetti simple (scroll en bas)
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    }
</script>
{% endblock %}
