{% extends 'base.html' %}

{% block title %}Accueil - Jeux Manon{% endblock %}

{% block nav %}Accueil{% endblock %}

{% block content %}
    
    <h1 class="page-title" onclick="secretAdminAccess(event)" style="cursor: default;">BONJOUR MANON !</h1>

    <div class="grid">
        <a href="{{ url_for('planning') }}#media-focus" class="card-link">
            <span class="icon"><img src="static\uploads\icones\Calendrier.png" alt="Calendrier"></span>
            <span>CALENDRIER</span>
        </a>

        <a href="{{ url_for('story_menu') }}" class="card-link">
            <span class="icon"><img src="static\uploads\icones\Histoires.png" alt="Histoires"></span>
            <span>HISTOIRE</span>
        </a>

        <a href="{{ url_for('writing_menu') }}" class="card-link">
            <span class="icon"><img src="static\uploads\icones\Ecriture.png" alt="Ecriture"></span>
            <span>ECRITURE</span>
        </a>

        <a href="{{ url_for('memory_menu') }}" class="card-link">
            <span class="icon"><img src="static\uploads\icones\Memory.png" alt="Memory"></span>
            <span>MEMORY</span>
        </a>

        <a href="{{ url_for('puzzle_menu') }}" class="card-link">
            <span class="icon"><img src="static\uploads\icones\Puzzle.png" alt="Puzzle"></span>
            <span>PUZZLE</span>
        </a>

        <a href="{{ url_for('music_random') }}" class="card-link">
            <span class="icon"><img src="static\uploads\icones\Musique.png" alt="Musique"></span>
            <span>MUSIQUE</span>
        </a>

        <a href="{{ url_for('photos_menu') }}" class="card-link">
            <span class="icon"><img src="static\uploads\icones\Photos.png" alt="Photos"></span>
            <span>PHOTO</span>
        </a>

        <a href="{{ url_for('videos_menu') }}" class="card-link">
            <span class="icon"><img src="static\uploads\icones\Vidéos.png" alt="Videos"></span>
            <span>VIDEO</span>
        </a>

    </div>

    <script>
        function secretAdminAccess(event) {
            // event.shiftKey = Touche Majuscule
            // event.ctrlKey = Touche Contrôle (Ctrl)
            // Le "&&" veut dire qu'il faut obligatoirement les DEUX en même temps
            if (event.shiftKey && event.ctrlKey) {
                window.location.href = "{{ url_for('admin') }}"; 
            }
        }
    </script>

{% endblock %}
